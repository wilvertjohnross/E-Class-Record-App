<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'none'; object-src 'none'; frame-src 'none'; base-uri 'none'; form-action 'none'">
<title>KLAS — One place for every Klas.</title>
<style>
  :root{
    /* Semantic theme tokens — the working UI is controlled from here.
       Legacy aliases below keep the existing form CSS stable while allowing
       light/dark themes to share one centrally managed palette. */
    --background:#F1E9D6;
    --surface:#FBF8F0;
    --surface-raised:#FFFFFF;
    --surface-subtle:#E7DBBE;
    --surface-muted:#EFE6CC;
    --text-primary:#1F2A3C;
    --text-secondary:#4A5568;
    --text-disabled:#6D7480;
    --border:rgba(79,65,45,.42);
    --border-strong:rgba(79,65,45,.62);
    --accent:#33513E;
    --accent-fill:#33513E;
    --accent-hover:#274232;
    --success:#2E5B3E;
    --warning:#9E5E2C;
    --error:#9E3A2C;
    --error-fill:#8A3328;
    --info:#356A8A;
    --on-accent:#FBF8F0;
    --focus-ring:rgba(51,81,62,.24);
    --overlay:rgba(31,42,60,.52);
    --shadow:rgba(31,42,60,.18);
    --shadow-raised:rgba(31,42,60,.22);

    /* Existing visual-language aliases. */
    --paper:var(--background);
    --paper-deep:var(--surface-subtle);
    --ink:var(--text-primary);
    --ink-soft:var(--text-secondary);
    --manila:#C9A876;
    --manila-deep:#B08D53;
    --red-pen:var(--error);
    --green-chalk:var(--accent);
    --white:var(--surface);
    --serif: Georgia, 'Times New Roman', 'Palatino Linotype', Palatino, serif;
    --sans: 'Segoe UI', Arial, -apple-system, BlinkMacSystemFont, Roboto, Helvetica, sans-serif;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;background:var(--paper);color:var(--ink);font-family:var(--sans);}
  body{min-height:100vh;}

  /* ===== Top bar ===== */
  header.appbar{
    background:var(--ink);
    color:var(--paper);
    padding:14px 22px;
    display:flex;
    align-items:center;
    gap:18px;
    flex-wrap:wrap;
    border-bottom:4px solid var(--red-pen);
  }
  header.appbar h1{
    font-family:var(--serif);
    font-size:22px;
    font-weight:700;
    margin:0;
    letter-spacing:0.3px;
    white-space:nowrap;
  }
  header.appbar h1 span{color:var(--manila);}
  .class-picker{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-left:auto;}
  select, input[type=text], input[type=number]{
    font-family:var(--sans);
    font-size:14px;
    padding:7px 10px;
    border-radius:3px;
    border:1px solid var(--border);
    background:var(--white);
    color:var(--ink);
  }
  header.appbar select{min-width:190px;}
  button{
    font-family:var(--sans);
    font-size:13.5px;
    padding:7px 13px;
    border-radius:3px;
    border:1px solid transparent;
    cursor:pointer;
    background:var(--manila);
    color:var(--ink);
    font-weight:600;
    transition:transform .08s ease, box-shadow .08s ease;
  }
  button:hover{transform:translateY(-1px);box-shadow:0 3px 8px var(--shadow);}
  button:active{transform:translateY(0);}
  button.ghost{background:transparent;color:var(--paper);border:1px solid var(--paper);}
  button.ghost:hover{background:rgba(255,255,255,0.08);}
  button.danger{background:var(--red-pen);color:var(--white);}
  button.primary{background:var(--green-chalk);color:var(--white);}
  button.small{padding:4px 9px;font-size:12px;}
  button:disabled{opacity:.45;cursor:not-allowed;transform:none;box-shadow:none;}

  /* ===== Tabs ===== */
  nav.tabs{
    display:flex;
    gap:2px;
    background:var(--paper-deep);
    padding:0 18px;
    border-bottom:2px solid var(--border);
    overflow-x:auto;
  }
  nav.tabs button.tab{
    background:var(--paper-deep);
    color:var(--ink-soft);
    border:none;
    border-bottom:3px solid transparent;
    border-radius:0;
    padding:11px 18px;
    font-weight:600;
    white-space:nowrap;
  }
  nav.tabs button.tab:hover{background:var(--manila);color:var(--ink);transform:none;box-shadow:none;}
  nav.tabs button.tab.active{background:var(--paper);color:var(--red-pen);border-bottom-color:var(--red-pen);}

  main{padding:24px;max-width:1180px;margin:0 auto;}
  .card{
    background:var(--white);
    border:1px solid var(--border);
    border-radius:5px;
    padding:22px;
    margin-bottom:20px;
    box-shadow:0 2px 6px var(--shadow);
  }
  .card h2{
    font-family:var(--serif);
    font-size:19px;
    margin:0 0 4px;
    color:var(--ink);
  }
  .card .sub{color:var(--ink-soft);font-size:13px;margin-bottom:16px;}
  .school-logo-settings{display:flex;align-items:center;gap:18px;flex-wrap:wrap;margin-top:10px;}
  .school-logo-preview{
    width:92px;height:92px;border:1px solid var(--border);border-radius:6px;background:#fff;
    display:flex;align-items:center;justify-content:center;padding:8px;box-shadow:0 1px 4px var(--shadow);
  }
  .school-logo-preview img{max-width:100%;max-height:100%;object-fit:contain;}
  .school-logo-actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap;}
  .school-logo-note{font-size:12.5px;color:var(--ink-soft);max-width:620px;line-height:1.45;margin-top:6px;}

  .empty-state{
    text-align:center;padding:50px 20px;color:var(--ink-soft);
  }
  .empty-state h2{color:var(--ink);}

  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
  .grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px;}
  @media (max-width:720px){.grid2,.grid3{grid-template-columns:1fr;}}
  .field label{display:block;font-size:12.5px;font-weight:700;color:var(--ink-soft);margin-bottom:4px;text-transform:uppercase;letter-spacing:.4px;}
  .field input, .field select{width:100%;}
  .field{margin-bottom:12px;}

  table.data{width:100%;border-collapse:collapse;font-size:13.5px;}
  table.data th, table.data td{border:1px solid var(--border);padding:6px 8px;text-align:center;}
  table.data th{background:var(--manila);color:var(--ink);font-weight:700;position:sticky;top:0;}
  table.data td.name-cell{text-align:left;font-weight:600;white-space:nowrap;}
  table.data tr.group-row td{background:var(--ink);color:var(--paper);font-weight:700;text-align:left;}
  table.data input{width:56px;text-align:center;padding:4px;}
  table.data td.computed{background:#F5EFE0;font-weight:700;color:var(--green-chalk);}
  table.data td.grade-final{background:#F5EFE0;font-weight:800;color:var(--red-pen);font-size:14.5px;}

  /* Summary of Grades: keep learner identity visible during horizontal scrolling. */
  table.summary-grade-table thead th:first-child{
    position:sticky;left:0;z-index:8;background:var(--manila);min-width:210px;max-width:260px;
    box-shadow:2px 0 0 var(--border-strong);
  }
  table.summary-grade-table tbody tr.summary-learner-row > td:first-child{
    position:sticky;left:0;z-index:4;background:var(--white);min-width:210px;max-width:260px;
    box-shadow:2px 0 0 var(--border);text-align:left;font-weight:600;white-space:nowrap;
  }
  .scroll-x{overflow-x:auto;}

  /* ===== Subject Teacher Classes: two-column setup + independently scrolling roster ===== */
  .class-setup-split{
    display:grid;
    grid-template-columns:minmax(0,1fr) minmax(480px,1.12fr);
    gap:20px;
    align-items:start;
  }
  .class-setup-split > .card{min-width:0;margin-bottom:20px;}
  .class-setup-card{align-self:start;}
  .class-roster-card{
    display:flex;
    flex-direction:column;
    align-self:start;
    position:sticky;
    top:12px;
    max-height:calc(100vh - 190px);
    min-height:540px;
  }
  .class-roster-card .hub-title-row{flex:0 0 auto;}
  .class-roster-card .toolbar,.class-roster-card .hint{flex:0 0 auto;}
  .class-roster-scroll{
    flex:1 1 auto;
    min-height:0;
    overflow:auto;
    border:1px solid var(--border);
    border-radius:4px;
  }
  .class-roster-scroll table.data{border-collapse:separate;border-spacing:0;}
  .class-roster-scroll table.data th{top:0;z-index:4;}
  .class-roster-scroll table.data tr.group-row td{position:sticky;top:32px;z-index:3;}
  @media (max-width:1050px){
    .class-setup-split{grid-template-columns:1fr;}
    .class-roster-card{position:static;max-height:none;min-height:0;}
    .class-roster-scroll{max-height:560px;}
  }

  /* ===== SF1 preserved-template viewer ===== */
  .sf1-viewer-card{max-width:980px;margin:0 auto;}
  .sf1-viewer-panel{display:flex;align-items:center;gap:18px;padding:20px;border:1px solid var(--border);background:var(--paper-deep);border-radius:8px;}
  .sf1-viewer-icon{width:78px;height:78px;display:flex;align-items:center;justify-content:center;flex:0 0 78px;border:2px solid var(--green-chalk);border-radius:8px;background:var(--white);color:var(--green-chalk);font-weight:900;font-size:22px;letter-spacing:.5px;}
  .sf1-viewer-copy strong{font-size:16px;color:var(--ink);}
  .sf1-viewer-copy p{margin:6px 0 8px;color:var(--ink-soft);line-height:1.5;}
  .sf1-viewer-meta{font-size:12.5px;font-weight:700;color:var(--green-chalk);}

  .comp-table td, .comp-table th{padding:6px;}

  /* v1.4.10 — compact Grading Weights workspace */
  .grading-weights-head{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:14px;}
  .grading-weights-head .sub{margin-bottom:0;max-width:760px;}
  .grading-category-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;align-items:stretch;}
  .cat-editor{display:flex;flex-direction:column;min-width:0;margin:0!important;padding:12px!important;border:1px solid var(--border)!important;border-radius:12px;background:var(--surface-raised);box-shadow:0 4px 14px var(--shadow);overflow:hidden;}
  .cat-editor .cat-editor-title{font-size:14px;font-weight:800;color:var(--ink);margin-bottom:8px;}
  .cat-editor .cat-controls{display:grid;grid-template-columns:minmax(0,1fr) 82px;gap:8px 10px;align-items:center;margin-bottom:12px;}
  .cat-editor .cat-controls .cat-weight{width:82px!important;}
  .cat-editor .cat-mode-row{grid-column:1 / -1;display:flex;align-items:flex-start;gap:7px;font-style:normal;line-height:1.35;}
  .cat-editor .comp-table-wrap{overflow-x:auto;flex:1 1 auto;}
  .cat-editor .comp-table{width:100%;min-width:0;table-layout:fixed;}
  .cat-editor .comp-table th,.cat-editor .comp-table td{padding:5px 3px;overflow-wrap:anywhere;white-space:normal;}
  .cat-editor .comp-table input{width:100%!important;min-width:0;box-sizing:border-box;padding:6px 3px;}
  button.icon-remove{display:inline-flex;align-items:center;justify-content:center;width:32px;height:32px;min-width:0;padding:6px;}
  .cat-editor .hps-legend{margin-top:6px;font-size:10px;line-height:1.3;}
  .cat-editor .comp-table th{font-size:11.5px;line-height:1.25;}
  .cat-editor .comp-add{align-self:flex-start;margin-top:12px!important;background:var(--accent-fill)!important;color:var(--on-accent)!important;border-color:var(--accent-fill)!important;font-weight:800;box-shadow:0 2px 6px var(--shadow);}
  .cat-editor .comp-add:hover{background:var(--accent-hover)!important;border-color:var(--accent-hover)!important;}
  .cat-editor .comp-add:disabled{background:var(--surface-muted)!important;color:var(--text-disabled)!important;border-color:var(--border)!important;box-shadow:none;}
  @media(max-width:1180px){.grading-category-grid{grid-template-columns:repeat(2,minmax(0,1fr));}}
  @media(max-width:820px){.grading-category-grid{grid-template-columns:1fr;}.cat-editor .comp-table{min-width:0;}}
  .weight-badge{
    display:inline-block;background:var(--green-chalk);color:var(--white);
    padding:2px 9px;border-radius:12px;font-size:12px;font-weight:700;margin-left:8px;
  }
  .weight-badge.warn{background:var(--red-pen);}

  .toolbar{display:flex;gap:10px;margin-bottom:14px;flex-wrap:wrap;align-items:center;}
  .hint{font-size:12.5px;color:var(--ink-soft);font-style:italic;}
  .desc-band{padding:2px 9px;border-radius:3px;font-weight:700;font-size:12px;color:var(--white);}
  .band-Advancing{background:#2E5B3E;}
  .band-Benchmarking{background:#3E7A54;}
  .band-Connecting{background:#B08D53;}
  .band-Developing{background:#9E5E2C;}
  .band-Emerging{background:var(--red-pen);}

  /* ===== Report card — SF9, two-page spread matching the official form ===== */
  .rc-spread{display:flex;gap:18px;justify-content:center;flex-wrap:wrap;margin-bottom:24px;}
  .rc-sheet{
    background:var(--white);
    border:1px solid var(--ink);
    width:520px;
    min-height:680px;
    padding:18px 22px;
    font-family:var(--serif);
    font-size:11px;
    line-height:1.35;
    position:relative;
  }
  .rc-sealrow{display:flex;align-items:flex-start;justify-content:center;gap:14px;margin-top:6px;}
  .rc-seal{width:70.2px;height:70.2px;flex-shrink:0;display:flex;align-items:center;justify-content:center;}
  .rc-seal img{width:100%;height:100%;object-fit:contain;}
  .rc-seal.placeholder{border:1.5px dashed var(--border);border-radius:50%;font-size:7px;color:var(--ink-soft);text-align:center;line-height:1.1;}
  .rc-headtext{text-align:center;flex:1;}
  .rc-headtext .l1{font-size:10.5px;}
  .rc-headtext .region{font-weight:700;color:var(--green-chalk);font-size:11px;margin-top:2px;}
  .rc-headtext .div{font-weight:700;color:var(--green-chalk);font-size:11px;}
  .rc-headtext .addr{font-size:9.5px;color:var(--ink-soft);}
  .rc-headtext .schoolname{font-weight:700;color:var(--ink);font-size:13px;margin-top:6px;}
  .rc-headtext .title{font-weight:700;font-size:11.5px;margin-top:2px;}
  .rc-headtext .sy{font-size:10.5px;}

  .rc-studentinfo{margin:14px 0 10px;font-size:11px;}
  .rc-studentinfo .row{display:flex;gap:6px;align-items:baseline;margin-bottom:2px;}
  .rc-studentinfo .row span.k{font-weight:400;white-space:nowrap;}
  .rc-studentinfo .row input{border:none;border-bottom:1px dotted var(--ink);background:transparent;flex:1;font-family:var(--serif);font-size:11px;padding:1px 2px;}

  .rc-parentmsg{margin-bottom:6px;text-indent:18px;font-size:11px;}
  .rc-approve{display:grid;grid-template-columns:1fr 1fr;text-align:center;gap:30px;margin:22px 0 14px;font-size:10.5px;}
  .rc-approve div{border-top:1px solid var(--ink);padding-top:3px;}

  .rc-h2{text-align:center;font-weight:700;font-size:11.5px;color:var(--green-chalk);margin:10px 0 6px;letter-spacing:.2px;}
  table.rc-grades{width:100%;border-collapse:collapse;font-size:10px;margin-bottom:10px;}
  table.rc-grades th, table.rc-grades td{border:1px solid var(--ink);padding:2px 4px;text-align:center;}
  table.rc-grades th{background:var(--paper-deep);font-weight:700;}
  table.rc-grades td.left{text-align:left;color:var(--green-chalk);}
  table.rc-grades tr.sub-area td.left{color:var(--ink-soft);font-style:italic;font-size:9.5px;padding-left:14px;}
  table.rc-grades input{width:32px;border:none;background:transparent;text-align:center;font-family:var(--sans);font-size:10px;}
  table.rc-grades tr.locked td.left{font-weight:700;}
  table.rc-grades tr.gen-avg td{font-style:italic;font-weight:700;}
  table.rc-grades tr.gen-avg td.left{text-align:right;}
  table.rc-grades td.rc-computed{font-weight:700;color:var(--red-pen);}

  table.rc-legend{width:auto;margin:0 auto;border-collapse:collapse;font-size:10px;}
  table.rc-legend td{border:none;padding:1px 10px 1px 0;text-align:left;}
  table.rc-legend td.scale{color:var(--ink-soft);}
  table.rc-legend td.desc{color:var(--green-chalk);}

  table.rc-att{width:100%;border-collapse:collapse;font-size:9.5px;margin-bottom:16px;}
  table.rc-att th, table.rc-att td{border:1px solid var(--ink);padding:3px 3px;text-align:center;background:#FFFFFF;}
  table.rc-att th{background:#FFFFFF;font-weight:700;}
  table.rc-att td.rc-att-label{text-align:left;font-weight:700;white-space:normal;font-size:9px;width:60px;background:#FFFFFF;}
  table.rc-att input{width:100%;border:none;background:transparent;text-align:center;font-size:9.5px;padding:1px;font-family:var(--sans);appearance:textfield;-moz-appearance:textfield;}
  table.rc-att input::-webkit-outer-spin-button, table.rc-att input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0;}

  .rc-comment-block{margin-bottom:10px;}
  .rc-comment-block label{font-size:10.5px;font-weight:700;margin-right:6px;}
  .rc-comment-block textarea{width:100%;border:none;border-bottom:1px solid var(--border);min-height:26px;font-family:var(--serif);font-size:10.5px;resize:vertical;padding:2px 3px;background:transparent;margin-top:2px;}

  .rc-sig-line{display:flex;align-items:baseline;gap:8px;border-bottom:1px solid var(--ink);margin:14px 0 2px 40px;padding-bottom:2px;}
  .rc-sig-line span.tl{font-size:10.5px;font-weight:700;width:44px;flex-shrink:0;}

  .rc-cert-title{text-align:center;font-weight:700;font-size:11px;margin:16px 0 6px;}
  .rc-cert-body{font-size:10.5px;margin-bottom:10px;}
  .rc-cert-field{display:flex;align-items:baseline;gap:6px;margin-bottom:8px;font-size:10.5px;}
  .rc-cert-field .line{flex:1;border-bottom:1px dotted var(--ink);min-height:14px;}
  .rc-cert-approve{margin-top:16px;}
  .rc-cert-approve .sigblock{width:260px;margin-left:auto;text-align:center;border-top:1px solid var(--ink);padding-top:3px;font-size:10.5px;}

  @media print{
    .rc-spread{display:block;}
  }


  /* ===== SF2 daily attendance working view ===== */
  .sf2-enable-option{display:flex;align-items:flex-start;gap:10px;padding:12px 14px;border:1px solid var(--border);border-radius:6px;background:var(--paper-deep);cursor:pointer;}
  .sf2-enable-option input{margin-top:3px;accent-color:var(--green-chalk);}
  .sf2-enable-option span{display:flex;flex-direction:column;gap:3px;}
  .sf2-enable-option small{font-weight:500;color:var(--ink-soft);line-height:1.4;}
  .sf2-card,.sf2-grid-card,.sf2-summary-card{max-width:none;}
  .sf2-heading{display:flex;align-items:flex-end;justify-content:space-between;gap:18px;flex-wrap:wrap;}
  .sf2-heading h2{margin-bottom:3px;}
  .sf2-month-block{display:flex;align-items:center;gap:8px;font-size:12px;font-weight:700;}
  .sf2-month-block select{min-width:165px;}
  .sf2-toolbar{margin-top:12px;}
  .sf2-schoolday-header{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:14px;margin-bottom:7px;font-size:12px;}
  .sf2-calendar{display:grid;grid-template-columns:repeat(auto-fill,minmax(52px,1fr));gap:5px;}
  .sf2-day-toggle{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;min-height:42px;padding:4px;border:1px solid var(--border);background:var(--paper-deep);color:var(--ink);border-radius:4px;}
  .sf2-day-toggle small{font-size:9px;color:var(--ink-soft);}
  .sf2-day-toggle.active{background:var(--green-chalk);color:var(--white);border-color:var(--green-chalk);}
  .sf2-day-toggle.active small{color:inherit;opacity:.9;}
  .sf2-day-toggle.weekend:not(.active){opacity:.55;}
  .sf2-scroll{max-height:60vh;border:1px solid var(--border);}
  table.sf2-table{border-collapse:separate;border-spacing:0;width:max-content;min-width:100%;font-size:11px;}
  table.sf2-table th,table.sf2-table td{border-right:1px solid var(--border);border-bottom:1px solid var(--border);padding:3px;text-align:center;background:var(--white);}
  table.sf2-table thead th{position:sticky;top:0;z-index:5;background:var(--manila);color:var(--ink);font-weight:800;}
  table.sf2-table .sf2-name{min-width:220px;max-width:280px;text-align:left;font-weight:700;padding-left:8px;}
  table.sf2-table .sticky-learner{position:sticky;left:0;z-index:4;background:var(--white);}
  table.sf2-table thead .sticky-learner{z-index:8;background:var(--manila);}
  table.sf2-table tr.group-row td{position:sticky;left:0;text-align:left;background:var(--ink);color:var(--paper);font-weight:800;z-index:3;padding:5px 8px;}
  .sf2-date-head{min-width:35px;}
  .sf2-date-head span,.sf2-date-head small{display:block;}
  .sf2-date-head small{font-size:9px;color:var(--ink-soft);}
  .sf2-att-cell{padding:0 !important;min-width:34px;}
  .sf2-mark{width:100%;height:31px;border:none;border-radius:0;background:transparent;color:var(--ink);font-size:18px;font-weight:900;padding:0;box-shadow:none;position:relative;overflow:hidden;}
  .sf2-mark:hover,.sf2-mark:focus{box-shadow:inset 0 0 0 2px var(--green-chalk);filter:none;}
  /* Mirror the official SF2 convention in the working grid: every box is divided by a dashed
     bottom-left -> top-right diagonal; state-specific marks are added on top of that divider. */
  .sf2-mark::before{content:"";position:absolute;left:-22%;top:50%;width:144%;border-top:1px dashed currentColor;transform:rotate(-42deg);transform-origin:center;pointer-events:none;z-index:3;}
  .sf2-mark.absent::after{content:"";position:absolute;left:-22%;top:50%;width:144%;border-top:2px solid currentColor;transform:rotate(42deg);transform-origin:center;pointer-events:none;z-index:4;}
  .sf2-mark.late::after{content:"";position:absolute;inset:0;background:currentColor;clip-path:polygon(0 0,100% 0,0 100%);pointer-events:none;z-index:1;}
  .sf2-mark.cutting::after{content:"";position:absolute;inset:0;background:currentColor;clip-path:polygon(0 100%,100% 0,100% 100%);pointer-events:none;z-index:1;}

  .sf2-remarks{min-width:230px;}
  .sf2-remarks input{width:100%;min-width:215px;border:0;background:transparent;padding:4px 6px;text-align:left;}
  .sf2-total-row td{font-weight:800;background:#F5EFE0!important;}
  .sf2-total-row .sticky-learner{background:#F5EFE0!important;}
  .sf2-fed-att{background:transparent!important;color:var(--ink)!important;cursor:default;}

  table.sf2-summary-table th,table.sf2-summary-table td{border:1px solid var(--border);padding:6px 8px;text-align:center;}
  table.sf2-summary-table th{background:var(--manila);font-weight:800;}
  table.sf2-summary-table td:first-child{text-align:left;font-weight:700;}
  table.sf2-summary-table input{width:82px;text-align:center;padding:4px;}

  .gs-topbar{display:flex;align-items:flex-start;justify-content:center;gap:18px;margin-bottom:8px;}
  .gs-headtext{text-align:center;font-family:var(--serif);}

  .gs-headtext .region, .gs-headtext .division{font-weight:800;font-size:12px;}

  .gs-headtext .schoolid{font-size:11px;}

  .gs-signoff .title{color:var(--ink-soft);font-size:10.5px;}

  table.cr-table{border-collapse:collapse;font-size:11.5px;width:100%;}
  table.cr-table th, table.cr-table td{border:1px solid var(--ink);padding:3px 5px;text-align:center;}
  table.cr-table thead tr.cr-band th{background:var(--ink);color:var(--paper);font-weight:700;font-size:11px;border-color:var(--paper);border-width:2px;}
  table.cr-table thead tr.cr-sub th{background:var(--manila);font-size:10.5px;}
  table.cr-table thead tr.cr-hps td, table.cr-table thead tr.cr-hps th{background:#EFE6CC;font-style:italic;font-size:10px;}
  table.cr-table td.left{text-align:left;font-weight:600;white-space:nowrap;}
  table.cr-table tr.group-row td{background:var(--ink);color:var(--paper);font-weight:700;text-align:left;}
  table.cr-table input{width:44px;text-align:center;padding:2px;font-size:11px;font-family:var(--sans);}
  table.cr-table input.score-input.score-input-error{outline:2px solid var(--red-pen);outline-offset:-1px;background:#FFF0F0;}
  .score-entry-notice{position:fixed;right:18px;bottom:18px;max-width:420px;z-index:10050;background:var(--ink);color:var(--paper);border:1px solid var(--border);border-left:5px solid var(--red-pen);border-radius:6px;padding:10px 14px;font-family:var(--sans);font-size:12px;font-weight:700;box-shadow:0 6px 18px rgba(0,0,0,.22);opacity:0;transform:translateY(8px);pointer-events:none;transition:opacity .12s ease,transform .12s ease;}
  .score-entry-notice.show{opacity:1;transform:translateY(0);}

  .gs-page{
    background:var(--white);border:1px solid var(--ink);

  @media print{
    @page{ size: A4 landscape; margin: 8mm; }
    @page sf9page{ size: A4 portrait; margin: 10mm; }
    @page gsportrait{ size: A4 portrait; margin: 8mm; }
    header.appbar, nav.tabs, .no-print{display:none !important;}
    body{background:white;}
    main{padding:0;max-width:none;}
    .card{box-shadow:none;border:none;}
    .cr-page{border:none;page-break-after:always;page-break-inside:avoid;max-width:none;width:100%;}
    .gs-page{page:gsportrait;border:none;page-break-after:always;page-break-inside:avoid;max-width:none;width:100%;}
    .rc-sheet{page:sf9page;border:none;page-break-after:always;page-break-inside:avoid;width:auto;min-height:0;}
    .rc-spread{gap:0;}
    table.cr-table input, table.rc-att input, .rc-studentinfo input{
      border:none;background:transparent;appearance:none;-webkit-appearance:none;padding:0;
    }
    table.cr-table{font-size:8.5px;width:100%;table-layout:auto;}
    table.cr-table th, table.cr-table td{padding:1px 2px;}
    table.cr-table input{width:100%;min-width:0;font-size:8.5px;}
    table.cr-master td.firstterm-cell, table.cr-master th.firstterm-cell-th{font-size:13px;}
    table.cr-master td.meta-label, table.cr-master td.meta-value{font-size:8.5px;}
    .cr-page{padding:6px 6px;}

    /* Force colored bands/borders to print even when the browser's
       "Background graphics" option is left unchecked — otherwise navy
       header bands print as white-on-white and the white divider borders
       between them vanish entirely. */
    *{ -webkit-print-color-adjust: exact !important; print-color-adjust: exact !important; color-adjust: exact !important; }

    /* Plain white sheet background for print, instead of the screen's
       cream tone — the color scheme's own accents (navy bands, red
       ink, manila boxes) still print, just not the paper tint. */
    .rc-sheet, .cr-page, .gs-page{ background:#FFFFFF; }
  }
