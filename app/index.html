<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'none'; object-src 'none'; frame-src 'none'; base-uri 'none'; form-action 'none'">
<title>E-Class Record App with GS and SF9</title>
<style>
  :root{
    --paper: #F1E9D6;
    --paper-deep: #E7DBBE;
    --ink: #1F2A3C;
    --ink-soft: #4A5568;
    --manila: #C9A876;
    --manila-deep: #B08D53;
    --red-pen: #9E3A2C;
    --green-chalk: #33513E;
    --border: #A8977A;
    --white: #FBF8F0;
    --shadow: rgba(31,42,60,0.18);
    --serif: Georgia, 'Iowan Old Style', 'Palatino Linotype', Palatino, serif;
    --sans: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;background:var(--paper);color:var(--ink);font-family:var(--sans);}
  body{min-height:100vh;}

  /* ===== Top bar ===== */
  header.appbar{
    background:var(--ink);
    color:var(--paper);
    padding:14px 22px;
    display:flex;
    align-items:center;
    gap:18px;
    flex-wrap:wrap;
    border-bottom:4px solid var(--red-pen);
  }
  header.appbar h1{
    font-family:var(--serif);
    font-size:22px;
    font-weight:700;
    margin:0;
    letter-spacing:0.3px;
    white-space:nowrap;
  }
  header.appbar h1 span{color:var(--manila);}
  .class-picker{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-left:auto;}
  select, input[type=text], input[type=number]{
    font-family:var(--sans);
    font-size:14px;
    padding:7px 10px;
    border-radius:3px;
    border:1px solid var(--border);
    background:var(--white);
    color:var(--ink);
  }
  header.appbar select{min-width:190px;}
  button{
    font-family:var(--sans);
    font-size:13.5px;
    padding:7px 13px;
    border-radius:3px;
    border:1px solid transparent;
    cursor:pointer;
    background:var(--manila);
    color:var(--ink);
    font-weight:600;
    transition:transform .08s ease, box-shadow .08s ease;
  }
  button:hover{transform:translateY(-1px);box-shadow:0 3px 8px var(--shadow);}
  button:active{transform:translateY(0);}
  button.ghost{background:transparent;color:var(--paper);border:1px solid var(--paper);}
  button.ghost:hover{background:rgba(255,255,255,0.08);}
  button.danger{background:var(--red-pen);color:var(--white);}
  button.primary{background:var(--green-chalk);color:var(--white);}
  button.small{padding:4px 9px;font-size:12px;}
  button:disabled{opacity:.45;cursor:not-allowed;transform:none;box-shadow:none;}

  /* ===== Tabs ===== */
  nav.tabs{
    display:flex;
    gap:2px;
    background:var(--paper-deep);
    padding:0 18px;
    border-bottom:2px solid var(--border);
    overflow-x:auto;
  }
  nav.tabs button.tab{
    background:var(--paper-deep);
    color:var(--ink-soft);
    border:none;
    border-bottom:3px solid transparent;
    border-radius:0;
    padding:11px 18px;
    font-weight:600;
    white-space:nowrap;
  }
  nav.tabs button.tab:hover{background:var(--manila);color:var(--ink);transform:none;box-shadow:none;}
  nav.tabs button.tab.active{background:var(--paper);color:var(--red-pen);border-bottom-color:var(--red-pen);}

  main{padding:24px;max-width:1180px;margin:0 auto;}
  .card{
    background:var(--white);
    border:1px solid var(--border);
    border-radius:5px;
    padding:22px;
    margin-bottom:20px;
    box-shadow:0 2px 6px var(--shadow);
  }
  .card h2{
    font-family:var(--serif);
    font-size:19px;
    margin:0 0 4px;
    color:var(--ink);
  }
  .card .sub{color:var(--ink-soft);font-size:13px;margin-bottom:16px;}
  .school-logo-settings{display:flex;align-items:center;gap:18px;flex-wrap:wrap;margin-top:10px;}
  .school-logo-preview{
    width:92px;height:92px;border:1px solid var(--border);border-radius:6px;background:#fff;
    display:flex;align-items:center;justify-content:center;padding:8px;box-shadow:0 1px 4px var(--shadow);
  }
  .school-logo-preview img{max-width:100%;max-height:100%;object-fit:contain;}
  .school-logo-actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap;}
  .school-logo-note{font-size:12.5px;color:var(--ink-soft);max-width:620px;line-height:1.45;margin-top:6px;}

  .empty-state{
    text-align:center;padding:50px 20px;color:var(--ink-soft);
  }
  .empty-state h2{color:var(--ink);}

  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
  .grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px;}
  @media (max-width:720px){.grid2,.grid3{grid-template-columns:1fr;}}
  .field label{display:block;font-size:12.5px;font-weight:700;color:var(--ink-soft);margin-bottom:4px;text-transform:uppercase;letter-spacing:.4px;}
  .field input, .field select{width:100%;}
  .field{margin-bottom:12px;}

  table.data{width:100%;border-collapse:collapse;font-size:13.5px;}
  table.data th, table.data td{border:1px solid var(--border);padding:6px 8px;text-align:center;}
  table.data th{background:var(--manila);color:var(--ink);font-weight:700;position:sticky;top:0;}
  table.data td.name-cell{text-align:left;font-weight:600;white-space:nowrap;}
  table.data tr.group-row td{background:var(--ink);color:var(--paper);font-weight:700;text-align:left;}
  table.data input{width:56px;text-align:center;padding:4px;}
  table.data td.computed{background:#F5EFE0;font-weight:700;color:var(--green-chalk);}
  table.data td.grade-final{background:#F5EFE0;font-weight:800;color:var(--red-pen);font-size:14.5px;}
  .scroll-x{overflow-x:auto;}

  .comp-table td, .comp-table th{padding:6px;}
  .weight-badge{
    display:inline-block;background:var(--green-chalk);color:var(--white);
    padding:2px 9px;border-radius:12px;font-size:12px;font-weight:700;margin-left:8px;
  }
  .weight-badge.warn{background:var(--red-pen);}

  .toolbar{display:flex;gap:10px;margin-bottom:14px;flex-wrap:wrap;align-items:center;}
  .hint{font-size:12.5px;color:var(--ink-soft);font-style:italic;}
  .desc-band{padding:2px 9px;border-radius:3px;font-weight:700;font-size:12px;color:var(--white);}
  .band-Advancing{background:#2E5B3E;}
  .band-Benchmarking{background:#3E7A54;}
  .band-Connecting{background:#B08D53;}
  .band-Developing{background:#9E5E2C;}
  .band-Emerging{background:var(--red-pen);}

  /* ===== Report card — SF9, two-page spread matching the official form ===== */
  .rc-spread{display:flex;gap:18px;justify-content:center;flex-wrap:wrap;margin-bottom:24px;}
  .rc-sheet{
    background:var(--white);
    border:1px solid var(--ink);
    width:520px;
    min-height:680px;
    padding:18px 22px;
    font-family:var(--serif);
    font-size:11px;
    line-height:1.35;
    position:relative;
  }
  .rc-corner{position:absolute;top:0;left:0;width:70px;height:10px;background:var(--ink);}
  .rc-sealrow{display:flex;align-items:flex-start;justify-content:center;gap:14px;margin-top:6px;}
  .rc-seal{width:52px;height:52px;flex-shrink:0;display:flex;align-items:center;justify-content:center;}
  .rc-seal img{width:100%;height:100%;object-fit:contain;}
  .rc-seal.placeholder{border:1.5px dashed var(--border);border-radius:50%;font-size:7px;color:var(--ink-soft);text-align:center;line-height:1.1;}
  .rc-headtext{text-align:center;flex:1;}
  .rc-headtext .l1{font-size:10.5px;}
  .rc-headtext .region{font-weight:700;color:var(--green-chalk);font-size:11px;margin-top:2px;}
  .rc-headtext .div{font-weight:700;color:var(--green-chalk);font-size:11px;}
  .rc-headtext .addr{font-size:9.5px;color:var(--ink-soft);}
  .rc-headtext .schoolname{font-weight:700;color:var(--ink);font-size:13px;margin-top:6px;}
  .rc-headtext .title{font-weight:700;font-size:11.5px;margin-top:2px;}
  .rc-headtext .sy{font-size:10.5px;}

  .rc-studentinfo{margin:14px 0 10px;font-size:11px;}
  .rc-studentinfo .row{display:flex;gap:6px;align-items:baseline;margin-bottom:2px;}
  .rc-studentinfo .row span.k{font-weight:400;white-space:nowrap;}
  .rc-studentinfo .row input{border:none;border-bottom:1px dotted var(--ink);background:transparent;flex:1;font-family:var(--serif);font-size:11px;padding:1px 2px;}

  .rc-parentmsg{margin-bottom:6px;text-indent:18px;font-size:11px;}
  .rc-approve{display:grid;grid-template-columns:1fr 1fr;text-align:center;gap:30px;margin:22px 0 14px;font-size:10.5px;}
  .rc-approve div{border-top:1px solid var(--ink);padding-top:3px;}

  .rc-h2{text-align:center;font-weight:700;font-size:11.5px;color:var(--green-chalk);margin:10px 0 6px;letter-spacing:.2px;}
  table.rc-grades{width:100%;border-collapse:collapse;font-size:10px;margin-bottom:10px;}
  table.rc-grades th, table.rc-grades td{border:1px solid var(--ink);padding:2px 4px;text-align:center;}
  table.rc-grades th{background:var(--paper-deep);font-weight:700;}
  table.rc-grades td.left{text-align:left;color:var(--green-chalk);}
  table.rc-grades tr.sub-area td.left{color:var(--ink-soft);font-style:italic;font-size:9.5px;padding-left:14px;}
  table.rc-grades input{width:32px;border:none;background:transparent;text-align:center;font-family:var(--sans);font-size:10px;}
  table.rc-grades tr.locked td.left{font-weight:700;}
  table.rc-grades tr.gen-avg td{font-style:italic;font-weight:700;}
  table.rc-grades tr.gen-avg td.left{text-align:right;}
  table.rc-grades td.rc-computed{font-weight:700;color:var(--red-pen);}

  table.rc-legend{width:auto;margin:0 auto;border-collapse:collapse;font-size:10px;}
  table.rc-legend td{border:none;padding:1px 10px 1px 0;text-align:left;}
  table.rc-legend td.scale{color:var(--ink-soft);}
  table.rc-legend td.desc{color:var(--green-chalk);}

  table.rc-att{width:100%;border-collapse:collapse;font-size:9.5px;margin-bottom:16px;}
  table.rc-att th, table.rc-att td{border:1px solid var(--ink);padding:3px 3px;text-align:center;}
  table.rc-att th{background:var(--paper-deep);font-weight:700;}
  table.rc-att td.rc-att-label{text-align:left;font-weight:700;white-space:normal;font-size:9px;width:60px;}
  table.rc-att input{width:100%;border:none;background:transparent;text-align:center;font-size:9.5px;padding:1px;font-family:var(--sans);}

  .rc-comment-block{margin-bottom:10px;}
  .rc-comment-block label{font-size:10.5px;font-weight:700;margin-right:6px;}
  .rc-comment-block textarea{width:100%;border:none;border-bottom:1px solid var(--border);min-height:26px;font-family:var(--serif);font-size:10.5px;resize:vertical;padding:2px 3px;background:transparent;margin-top:2px;}

  .rc-sig-line{display:flex;align-items:baseline;gap:8px;border-bottom:1px solid var(--ink);margin:14px 0 2px 40px;padding-bottom:2px;}
  .rc-sig-line span.tl{font-size:10.5px;font-weight:700;width:44px;flex-shrink:0;}

  .rc-cert-title{text-align:center;font-weight:700;font-size:11px;margin:16px 0 6px;}
  .rc-cert-body{font-size:10.5px;margin-bottom:10px;}
  .rc-cert-field{display:flex;align-items:baseline;gap:6px;margin-bottom:8px;font-size:10.5px;}
  .rc-cert-field .line{flex:1;border-bottom:1px dotted var(--ink);min-height:14px;}
  .rc-cert-approve{margin-top:16px;}
  .rc-cert-approve .sigblock{width:260px;margin-left:auto;text-align:center;border-top:1px solid var(--ink);padding-top:3px;font-size:10.5px;}

  @media print{
    .rc-spread{display:block;}
  }

  /* ===== Class Record / Grading Sheet (matches the DepEd ECR layout) ===== */
  .cr-topbar{display:flex;align-items:center;justify-content:center;gap:24px;margin-bottom:12px;}
  .cr-seal{width:64px;height:64px;flex-shrink:0;}
  .cr-seal img{width:100%;height:100%;object-fit:contain;}
  .cr-seal.wordmark{width:130px;height:auto;}
  .cr-title{font-family:var(--sans);font-weight:800;font-size:22px;letter-spacing:.3px;color:var(--ink);text-align:center;}
  .cr-fieldrow{display:flex;gap:14px;margin-bottom:6px;justify-content:center;}
  .cr-fieldrow .f{display:flex;align-items:center;gap:8px;font-family:var(--sans);font-size:12px;font-weight:700;}
  .cr-fieldrow .f.wide{flex:1.6;}
  .cr-fieldrow .f .box{border:1px solid var(--ink);background:var(--paper-deep);padding:3px 10px;border-radius:2px;flex:1;text-align:center;color:var(--green-chalk);font-weight:700;min-width:110px;}
  .cr-navybar{height:9px;background:var(--ink);margin:8px 0;}
  .cr-termrow{display:flex;align-items:stretch;border:1px solid var(--ink);border-bottom:none;font-family:var(--sans);}
  .cr-termrow .term-label{flex:1.1;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:17px;border-right:1px solid var(--ink);padding:6px;}
  .cr-termrow .term-fields{flex:1;border-right:1px solid var(--ink);display:flex;flex-direction:column;}
  .cr-termrow .term-fields:last-child{border-right:none;}
  .cr-termrow .term-fields div{display:flex;justify-content:space-between;padding:2px 8px;font-size:11px;border-bottom:1px solid var(--border);}
  .cr-termrow .term-fields div:last-child{border-bottom:none;}
  .cr-termrow .term-fields label{font-weight:700;}
  .cr-termrow .term-fields span{color:var(--green-chalk);font-weight:700;}

  .gs-topbar{display:flex;align-items:flex-start;justify-content:center;gap:18px;margin-bottom:8px;}
  .gs-headtext{text-align:center;font-family:var(--serif);}
  .gs-headtext .deped-script{font-size:15px;font-weight:700;font-style:italic;}
  .gs-headtext .region, .gs-headtext .division{font-weight:800;font-size:12px;}
  .gs-headtext .schoolname{font-size:11.5px;margin-top:2px;}
  .gs-headtext .schoolid{font-size:11px;}
  .gs-headtext .sy{font-size:11px;font-style:italic;}
  .gs-fieldrow{display:flex;justify-content:center;gap:26px;font-size:12px;margin-bottom:2px;}
  .term-label{font-family:var(--sans);font-weight:800;font-size:18px;text-align:left;}
  .gs-signoff{display:flex;justify-content:space-around;text-align:center;margin-top:26px;font-size:11.5px;}
  .gs-signoff .lbl{font-weight:700;margin-bottom:18px;}
  .gs-signoff .who{font-weight:700;color:var(--green-chalk);border-top:1px solid var(--ink);padding-top:3px;}
  .gs-signoff .title{color:var(--ink-soft);font-size:10.5px;}

  table.cr-table{border-collapse:collapse;font-size:11.5px;width:100%;}
  table.cr-table th, table.cr-table td{border:1px solid var(--ink);padding:3px 5px;text-align:center;}
  table.cr-table thead tr.cr-band th{background:var(--ink);color:var(--paper);font-weight:700;font-size:11px;border-color:var(--paper);border-width:2px;}
  table.cr-table thead tr.cr-sub th{background:var(--manila);font-size:10.5px;}
  table.cr-table thead tr.cr-hps td, table.cr-table thead tr.cr-hps th{background:#EFE6CC;font-style:italic;font-size:10px;}
  table.cr-table td.left{text-align:left;font-weight:600;white-space:nowrap;}
  table.cr-table tr.group-row td{background:var(--ink);color:var(--paper);font-weight:700;text-align:left;}
  table.cr-table input{width:44px;text-align:center;padding:2px;font-size:11px;font-family:var(--sans);}
  table.cr-table td.blank-cell{background:repeating-linear-gradient(45deg, #f7f3e8, #f7f3e8 4px, #eee3c8 4px, #eee3c8 5px);}
  table.cr-table td.computed{background:#F5EFE0;font-weight:700;color:var(--green-chalk);}
  table.cr-table td.grade-final{background:#F5EFE0;font-weight:800;color:var(--red-pen);}

  /* Master Class Record table: FIRST TERM / meta rows / HPS row / LEARNERS' NAMES */
  table.cr-master thead tr.cr-sub th{background:#D9E6F2;color:var(--ink);}
  table.cr-master thead tr.cr-hps td, table.cr-master thead tr.cr-hps td.hps-label{background:var(--white);font-style:italic;font-size:10px;}
  table.cr-master td.firstterm-cell{font-family:var(--sans);font-weight:800;font-size:19px;text-align:center;background:var(--white);vertical-align:middle;}
  table.cr-master td.meta-label{font-weight:700;background:var(--white);text-align:left;padding-left:8px;white-space:nowrap;}
  table.cr-master td.meta-value{background:var(--paper-deep);color:var(--green-chalk);font-weight:700;}
  table.cr-master td.hps-label{text-align:left;font-weight:700;font-style:italic;white-space:nowrap;padding-left:8px;}
  table.cr-master tr.names-row td{background:var(--white);border-top:2px solid var(--ink);}
  table.cr-master tr.names-row-navy td{background:var(--ink);color:var(--paper);border-top:2px solid var(--ink);}
  table.cr-master th.firstterm-cell-th{font-family:var(--sans);font-weight:800;font-size:19px;background:var(--white);vertical-align:middle;color:var(--ink);text-align:center;}
  table.gs-inforow{width:100%;border-collapse:collapse;font-size:12px;font-family:var(--sans);margin-bottom:6px;}
  table.gs-inforow td{border:1px solid var(--ink);padding:4px 10px;}
  table.gs-inforow td.lbl{font-weight:700;white-space:nowrap;width:1%;}
  table.gs-inforow td.val{color:var(--green-chalk);font-weight:700;text-align:center;}

  .gs-page{
    background:var(--white);border:1px solid var(--ink);
    padding:14px 22px;max-width:1050px;margin:0 auto 22px;
  }
  .cr-page{
    background:var(--white);border:1px solid var(--ink);
    padding:14px 22px;max-width:1050px;margin:0 auto 22px;
  }
  .cr-viewtoggle{display:inline-flex;border:1px solid var(--border);border-radius:4px;overflow:hidden;}
  .cr-viewtoggle button{border-radius:0;border:none;background:var(--paper-deep);}
  .cr-viewtoggle button.active{background:var(--green-chalk);color:var(--white);}

  @media print{
    @page{ size: A4 landscape; margin: 8mm; }
    @page sf9page{ size: A4 portrait; margin: 10mm; }
    @page gsportrait{ size: A4 portrait; margin: 8mm; }
    header.appbar, nav.tabs, .no-print{display:none !important;}
    body{background:white;}
    main{padding:0;max-width:none;}
    .card{box-shadow:none;border:none;}
    .cr-page{border:none;page-break-after:always;page-break-inside:avoid;max-width:none;width:100%;}
    .gs-page{page:gsportrait;border:none;page-break-after:always;page-break-inside:avoid;max-width:none;width:100%;}
    .rc-sheet{page:sf9page;border:none;page-break-after:always;page-break-inside:avoid;width:auto;min-height:0;}
    .rc-spread{gap:0;}
    table.cr-table input, table.rc-att input, .rc-studentinfo input{
      border:none;background:transparent;appearance:none;-webkit-appearance:none;padding:0;
    }
    table.cr-table{font-size:8.5px;width:100%;table-layout:auto;}
    table.cr-table th, table.cr-table td{padding:1px 2px;}
    table.cr-table input{width:100%;min-width:0;font-size:8.5px;}
    table.cr-master td.firstterm-cell, table.cr-master th.firstterm-cell-th{font-size:13px;}
    table.cr-master td.meta-label, table.cr-master td.meta-value{font-size:8.5px;}
    .cr-page{padding:6px 6px;}

    /* Force colored bands/borders to print even when the browser's
       "Background graphics" option is left unchecked — otherwise navy
       header bands print as white-on-white and the white divider borders
       between them vanish entirely. */
    *{ -webkit-print-color-adjust: exact !important; print-color-adjust: exact !important; color-adjust: exact !important; }

    /* Plain white sheet background for print, instead of the screen's
       cream tone — the color scheme's own accents (navy bands, red
       ink, manila boxes) still print, just not the paper tint. */
    .rc-sheet, .cr-page, .gs-page{ background:#FFFFFF; }
  }

  footer.status{
    padding:8px 22px;font-size:12px;color:var(--ink-soft);
    display:flex;justify-content:space-between;
  }
  /* ===== Desktop-safe in-app dialogs ===== */
  .app-modal-backdrop{
    position:fixed;inset:0;z-index:10000;
    background:rgba(31,42,60,.52);
    display:flex;align-items:center;justify-content:center;
    padding:24px;
  }
  .app-modal{
    width:min(520px,100%);
    background:var(--white);color:var(--ink);
    border:1px solid var(--border);border-top:5px solid var(--red-pen);
    border-radius:6px;box-shadow:0 14px 40px rgba(31,42,60,.30);
    padding:20px;
  }
  .app-modal h3{
    margin:0 0 6px;font-family:var(--serif);font-size:20px;
  }
  .app-modal p{margin:0 0 14px;color:var(--ink-soft);font-size:13px;line-height:1.45;}
  .app-modal input,.app-modal textarea{
    width:100%;font-family:var(--sans);font-size:14px;
    border:1px solid var(--border);border-radius:3px;background:#fff;color:var(--ink);
    padding:9px 10px;outline:none;
  }
  .app-modal textarea{min-height:190px;resize:vertical;line-height:1.4;}
  .app-modal input:focus,.app-modal textarea:focus{
    border-color:var(--green-chalk);box-shadow:0 0 0 2px rgba(51,81,62,.15);
  }
  .app-modal-actions{display:flex;justify-content:flex-end;gap:9px;margin-top:16px;}
  .app-modal-actions .cancel{background:var(--paper-deep);color:var(--ink);border:1px solid var(--border);}
  .app-modal-error{min-height:17px;margin-top:7px;color:var(--red-pen);font-size:12px;font-weight:600;}
  .app-modal.import-modal{width:min(920px,100%);max-height:90vh;overflow:auto;}
  .import-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin:10px 0 14px;}
  .import-grid .field{margin:0;}
  .import-grid select{width:100%;}
  .import-map-table{width:100%;border-collapse:collapse;font-size:12.5px;margin-top:8px;}
  .import-map-table th,.import-map-table td{border:1px solid var(--border);padding:6px 7px;text-align:left;}
  .import-map-table th{background:var(--paper-deep);}
  .import-map-table select{width:100%;min-width:180px;}
  .import-options{display:flex;gap:18px;flex-wrap:wrap;margin:12px 0 4px;font-size:12.5px;}
  .import-options label{display:flex;align-items:center;gap:7px;font-weight:600;}
  .import-options input[type=checkbox]{width:auto;}
  .import-summary{background:#F5EFE0;border:1px solid var(--border);padding:9px 11px;border-radius:4px;font-size:12.5px;margin:8px 0;}
  @media (max-width:720px){.import-grid{grid-template-columns:1fr;}}
  .badge-count{background:var(--paper-deep);border:1px solid var(--border);border-radius:10px;padding:1px 9px;font-size:11.5px;margin-left:6px;}


  /* ===== v1.0.16 usability polish ===== */
  .old-english{
    font-family:"Old English Text MT","Engravers Old English","Lucida Blackletter",Georgia,serif;
    letter-spacing:.2px;
  }
  .cr-head-center{flex:1;text-align:center;min-width:280px;}
  .cr-head-center .gov-line{font-size:14px;line-height:1.05;}
  .cr-head-center .dep-line{font-size:17px;line-height:1.15;margin:1px 0 3px;}
  .gs-headtext .republic-script,
  .gs-headtext .deped-script,
  .rc-headtext .l1.old-english{font-family:"Old English Text MT","Engravers Old English","Lucida Blackletter",Georgia,serif;}
  .gs-headtext .republic-script{font-size:12.5px;font-weight:700;}

  /* Freeze learner identity while horizontally scrolling the Class Record. */
  table.cr-table tbody tr[data-sid] > td.sticky-learner{
    position:sticky;left:0;z-index:6;
    background:var(--white);
    box-shadow:2px 0 0 var(--border), 4px 0 8px rgba(31,42,60,.08);
    min-width:190px;max-width:260px;
  }
  table.cr-table tbody tr[data-sid]:hover > td.sticky-learner{background:var(--paper-deep);}

  .theme-toggle{min-width:88px;}
  #restoreWindowBtn{
    display:none;position:fixed;left:50%;bottom:18px;transform:translateX(-50%);
    z-index:12000;padding:10px 16px;border-radius:22px;
    background:var(--green-chalk);color:var(--white);border:1px solid var(--border);
    box-shadow:0 6px 22px rgba(0,0,0,.28);font-weight:700;
  }
  #restoreWindowBtn.visible{display:block;}
  #restoreWindowBtn:hover{transform:translateX(-50%) translateY(-1px);}

  /* Dark mode changes only the working UI. Official-template exports remain unchanged. */
  html[data-theme="dark"]{
    color-scheme:dark;
    --paper:#151A21;
    --paper-deep:#202731;
    --ink:#E7EDF4;
    --ink-soft:#AAB4C0;
    --manila:#B79A69;
    --manila-deep:#9A7E50;
    --red-pen:#E07A6D;
    --green-chalk:#76B58C;
    --border:#465362;
    --white:#1B222B;
    --shadow:rgba(0,0,0,.42);
  }
  html[data-theme="dark"] .school-logo-preview{background:#fff;}
  html[data-theme="dark"] table.data td.computed,
  html[data-theme="dark"] table.data td.grade-final,
  html[data-theme="dark"] table.cr-table td.computed,
  html[data-theme="dark"] table.cr-table td.grade-final,
  html[data-theme="dark"] .import-summary{background:#242D38;}
  html[data-theme="dark"] table.cr-table thead tr.cr-hps td,
  html[data-theme="dark"] table.cr-table thead tr.cr-hps th{background:#29323D;}
  html[data-theme="dark"] table.cr-master thead tr.cr-sub th{background:#2D3A48;color:var(--ink);}
  html[data-theme="dark"] table.cr-master td.meta-value,
  html[data-theme="dark"] table.gs-inforow td.val{background:#202731;color:var(--green-chalk);}
  html[data-theme="dark"] .app-modal input,
  html[data-theme="dark"] .app-modal textarea,
  html[data-theme="dark"] select,
  html[data-theme="dark"] input[type=text],
  html[data-theme="dark"] input[type=number]{background:#11161C;color:var(--ink);}
  html[data-theme="dark"] .rc-sheet,
  html[data-theme="dark"] .cr-page,
  html[data-theme="dark"] .gs-page{background:#1B222B;}
  html[data-theme="dark"] table.rc-grades th,
  html[data-theme="dark"] table.rc-att th{background:#29323D;}

  @media print{
    #restoreWindowBtn{display:none !important;}
  }

</style>
</head>
<body>

<header class="appbar">
  <h1>E-Class Record App <span>with GS and SF9</span></h1>
  <div class="class-picker no-print">
    <select id="classSelect"></select>
    <button id="btnTheme" class="ghost theme-toggle" title="Toggle light/dark working view">🌙 Dark</button>
    <button id="btnNewClass" class="ghost">+ New Class</button>
    <button id="btnDupClass" class="ghost">Duplicate</button>
    <button id="btnDelClass" class="ghost">Delete</button>
    <button id="btnExport" class="ghost">Export Backup</button>
    <button id="btnImport" class="ghost">Import Backup</button>
    <input type="file" id="fileImport" accept="application/json" style="display:none;">
  </div>
</header>

<nav class="tabs no-print" id="tabs">
  <button class="tab" data-tab="setup">Setup</button>
  <button class="tab" data-tab="roster">Roster</button>
  <button class="tab" data-tab="term1">Term 1</button>
  <button class="tab" data-tab="term2">Term 2</button>
  <button class="tab" data-tab="term3">Term 3</button>
  <button class="tab" data-tab="final">Final Grades</button>
  <button class="tab" data-tab="summary">Summary of Term Grade</button>
  <button class="tab" data-tab="report">Report Cards</button>
</nav>

<main id="main"></main>
<button type="button" id="restoreWindowBtn" class="no-print" title="Leave full screen and restore a regular window">↙ Restore Window</button>

<footer class="status no-print">
  <span id="statusLeft">Ready.</span>
  <span id="statusVersion" title="Application/update status"></span>
  <span id="statusRight">Saved automatically to this device.</span>
</footer>

<script src="app.js"></script>
</body>
</html>
